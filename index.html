<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>传说之下：毒师宇宙 v1.0</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", "Microsoft YaHei", monospace;
      background: #050505;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #050505;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      color: #fff;
    }

    #app {
      display: flex;
      width: min(100%, 640px);
      max-height: 100%;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #gameContainer {
      position: relative;
      width: min(640px, 100%);
      aspect-ratio: 4 / 3;
      flex: 0 1 auto;
      overflow: hidden;
      border: 3px solid #444;
      background: #000;
      box-shadow: 0 0 24px rgba(0, 255, 136, 0.12);
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #touchControls {
      display: none;
      width: min(640px, 100%);
      min-height: 142px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 6px;
      touch-action: none;
    }

    .dpad {
      display: grid;
      grid-template: repeat(3, 44px) / repeat(3, 44px);
      gap: 3px;
      flex: 0 0 auto;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .control {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 2px solid #666;
      border-radius: 6px;
      background: #191919;
      color: #fff;
      font: 700 20px/1 "Courier New", monospace;
      touch-action: none;
    }

    .control.action {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 18px;
    }

    .control[data-key="confirm"] { border-color: #e65050; }
    .control[data-key="cancel"] { border-color: #4f9ee8; }
    .control[data-key="menu"] { border-color: #d3bd40; }

    .control.active {
      border-color: #fff;
      background: #00c978;
      color: #000;
    }

    #tbUp { grid-area: 1 / 2; }
    #tbLeft { grid-area: 2 / 1; }
    #tbRight { grid-area: 2 / 3; }
    #tbDown { grid-area: 3 / 2; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: none), (pointer: coarse) {
      #touchControls { display: flex; }
      #gameContainer {
        width: min(640px, 100%, calc((100dvh - 166px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3));
      }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      body {
        padding: max(4px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      }
      #app {
        width: 100%;
        height: 100%;
        max-width: none;
        flex-direction: row;
        justify-content: center;
        gap: 0;
      }
      #gameContainer {
        flex: 1 1 auto;
        margin: auto;
        width: auto;
        max-width: min(640px, calc(100vw - 292px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        max-height: calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        aspect-ratio: 4 / 3;
      }
      #touchControls {
        position: fixed;
        inset: 0;
        display: block;
        pointer-events: none;
        z-index: 2;
      }
      .dpad,
      .actions {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: auto;
      }
      .dpad {
        left: max(8px, env(safe-area-inset-left));
        grid-template: repeat(3, 40px) / repeat(3, 40px);
        gap: 2px;
      }
      .actions {
        right: max(8px, env(safe-area-inset-right));
        grid-template: repeat(3, 44px) / 44px;
        gap: 8px;
      }
      .control {
        width: 40px;
        height: 40px;
        border-width: 1.5px;
        background: rgba(25, 25, 25, 0.72);
        font-size: 17px;
      }
      .control.action {
        width: 44px;
        height: 44px;
        font-size: 15px;
      }
      .control.active { background: rgba(0, 201, 120, 0.9); }
    }

    @media (max-width: 390px) and (orientation: portrait) {
      #touchControls { min-height: 126px; gap: 10px; padding: 0; }
      .dpad { grid-template: repeat(3, 39px) / repeat(3, 39px); gap: 2px; }
      .control { width: 39px; height: 39px; }
      .actions { grid-template-columns: repeat(3, 46px); gap: 6px; }
      .control.action { width: 46px; height: 46px; font-size: 16px; }
      #gameContainer { width: min(640px, 100%, calc((100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3)); }
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="gameContainer">
      <canvas id="game" width="640" height="480" aria-label="传说之下：毒师宇宙游戏画面"></canvas>
    </div>

    <section id="touchControls" aria-label="触屏游戏控制">
      <div class="dpad">
        <button id="tbUp" class="control" type="button" data-key="up" aria-label="向上">&#9650;</button>
        <button id="tbLeft" class="control" type="button" data-key="left" aria-label="向左">&#9664;</button>
        <button id="tbRight" class="control" type="button" data-key="right" aria-label="向右">&#9654;</button>
        <button id="tbDown" class="control" type="button" data-key="down" aria-label="向下">&#9660;</button>
      </div>
      <div class="actions">
        <button id="tbX" class="control action" type="button" data-key="cancel" aria-label="取消">X</button>
        <button id="tbC" class="control action" type="button" data-key="menu" aria-label="菜单">C</button>
        <button id="tbZ" class="control action" type="button" data-key="confirm" aria-label="确认">Z</button>
      </div>
    </section>
    <p class="sr-only">键盘使用方向键或 WASD 移动，Z 或 Enter 确认，X 或 Escape 取消，C 打开菜单。</p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/battle_draw.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/overworld.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
